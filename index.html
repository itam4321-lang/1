<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa JARK — jednostki krajobrazowe</title>
<style>
:root{--ink:#1d1d18;--paper:#f7f7f2;--accent:#6b6636;--line:#d4d3c7}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}
header{height:82px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);background:#fff}
.brand{font-weight:800;font-size:20px}.brand span{color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(320px,68fr) minmax(340px,32fr);height:calc(100vh - 82px)}
.map-pane{position:relative;display:grid;place-items:center;padding:24px;overflow:hidden;background:#ebece6}
.map-wrap{position:relative;width:100%;height:100%;max-height:760px;cursor:grab}
.map-wrap.dragging{cursor:grabbing}svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.08))}
.jark{fill:rgba(107,102,54,.12);stroke:#57574d;stroke-width:.9;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s,stroke .15s}
.jark:hover{fill:rgba(107,102,54,.38);stroke:#111}.jark.active{fill:rgba(107,102,54,.72);stroke:#111;stroke-width:2}
.label{font-size:5px;font-weight:800;text-anchor:middle;fill:#fff;pointer-events:none;paint-order:stroke;stroke:#3b3b32;stroke-width:.8}
.controls{position:absolute;right:38px;bottom:38px;display:flex;flex-direction:column;gap:6px}.controls button{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:22px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.panel{border-left:1px solid var(--line);background:#fff;overflow:auto;padding:28px 30px}.empty{margin-top:20vh}.empty h1{font-size:28px;margin:0 0 8px}.empty p{color:#68695f}
.kicker{color:var(--accent);font-weight:800;font-size:13px;text-transform:uppercase}.panel h1{font-size:30px;line-height:1.08;margin:6px 0 18px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:18px}.meta div{font-size:13px}.meta b{display:block;color:#77786c;font-size:11px;text-transform:uppercase}
.panel h2{font-size:16px;margin:20px 0 6px}.panel p{margin:0 0 10px;color:#505146}.navrow{display:flex;gap:8px;margin:16px 0}.navrow button{flex:1;height:42px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer}.navrow button:hover{border-color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0}.photos img{width:100%;height:150px;object-fit:cover;border-radius:8px}
.search{position:absolute;left:38px;top:38px;width:min(260px,35%)}.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:rgba(255,255,255,.96);font-size:14px}
.tip{position:absolute;display:none;background:#1d1d18;color:#fff;padding:6px 9px;border-radius:6px;font-size:13px;pointer-events:none;z-index:5}
.list{display:none}
@media(max-width:900px){header{height:68px}.layout{grid-template-columns:1fr;height:auto}.map-pane{height:58vh;padding:10px}.map-wrap{height:100%}.panel{border-left:0;border-top:1px solid var(--line);min-height:42vh}.controls{right:20px;bottom:20px}.search{left:20px;top:20px}.empty{margin-top:20px}}
</style>
</head>
<body>
<header><div class="brand">JARK <span>— jednostki krajobrazowe</span></div></header>
<div class="layout">
  <main class="map-pane">
    <div class="search"><input id="search" type="search" placeholder="Szukaj obszaru lub nazwy…"></div>
    <div class="map-wrap" id="mapWrap">
      <svg id="map" viewBox="0 0 602 329" role="img" aria-label="Mapa jednostek JARK">
        <defs><clipPath id="clip"><rect width="602" height="329"/></clipPath></defs>
        <image href="mapa.png" x="0" y="0" width="602" height="329" preserveAspectRatio="xMidYMid meet"/>
        <g id="areas"></g><g id="labels"></g>
      </svg>
      <div class="tip" id="tip"></div>
    </div>
    <div class="controls"><button id="in" aria-label="Przybliż">+</button><button id="out" aria-label="Oddal">−</button><button id="reset" aria-label="Pokaż całość">⟳</button></div>
  </main>
  <aside class="panel" id="panel"><div class="empty"><div class="kicker">Mapa JARK</div><h1>Wybierz jednostkę</h1><p>Kliknij obszar na mapie, aby zobaczyć opis i charakterystykę.</p></div></aside>
</div>
<script>
const $=s=>document.querySelector(s), svg=$('#map'), wrap=$('#mapWrap'), panel=$('#panel'), tip=$('#tip');
let data=[], active=null, vb=[0,0,602,329],drag=null,moved=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setVB(){svg.setAttribute('viewBox',vb.join(' '));}
function render(){
  $('#areas').innerHTML=[...data].sort((a,b)=>b.area-a.area).map(c=>`<path class="jark" data-n="${c.n}" d="${esc(c.d)}"><title>${c.n}. ${esc(c.name||c.code)}</title></path>`).join('');
  $('#labels').innerHTML=data.map(c=>`<text class="label" x="${c.lx}" y="${c.ly}">${c.n}</text>`).join('');
}
function show(n,scroll=false){const c=data.find(x=>x.n===n);if(!c)return;active=n;
 document.querySelectorAll('.jark.active').forEach(e=>e.classList.remove('active'));document.querySelector(`.jark[data-n="${n}"]`)?.classList.add('active');
 const i=data.indexOf(c),prev=data[(i-1+data.length)%data.length],next=data[(i+1)%data.length];
 const photos=(c.photos||[]).map(p=>`<img src="${esc(p.src)}" alt="Zdjęcie obszaru ${esc(c.name||c.code)}" loading="lazy">`).join('');
 panel.innerHTML=`<div class="kicker">JARK ${esc(c.code)}</div><h1>${c.n}. ${esc(c.name||'Bez nazwy')}</h1>
 <div class="navrow"><button data-nav="${prev.n}">← ${prev.n}</button><button data-focus="${n}">Pokaż na mapie</button><button data-nav="${next.n}">${next.n} →</button></div>
 ${photos?`<div class="photos">${photos}</div>`:''}
 <div class="meta"><div><b>Własność</b>${esc(c.wlasnosc||'—')}</div><div><b>Dostępność</b>${esc(c.dostepnosc||'—')}</div></div>
 <h2>Zabudowa i zieleń</h2><p><b>Typ zabudowy:</b> ${esc(c.typ_zab||'—')}</p><p><b>Typ zieleni:</b> ${esc(c.typ_ziel||'—')}</p><p><b>Charakterystyczne elementy:</b> ${esc(c.char_el||'—')}</p><p><b>Funkcja zabudowy:</b> ${esc(c.fun_zab||'—')}</p><p><b>Funkcja zieleni:</b> ${esc(c.fun_ziel||'—')}</p>
 <h2>Walory i ocena</h2><p><b>Walory zabudowy:</b> ${esc(c.wal_zab||'—')}</p><p><b>Walory zieleni:</b> ${esc(c.wal_ziel||'—')}</p>
 <h2>Charakterystyka</h2><p>${esc(c.charakterystyka||'—')}</p>
 ${c.historia?`<h2>Historia</h2><p>${esc(c.historia)}</p>`:''}<h2>Ochrona</h2><p>${esc(c.ochrona||'—')}</p><h2>Zagrożenia</h2><p>${esc(c.zagrozenia||'—')}</p><h2>Wnioski</h2><p>${esc(c.wnioski||'—')}</p>`;
 try{history.replaceState(null,'','#jark-'+n)}catch(e){} if(scroll&&innerWidth<=900)panel.scrollIntoView({behavior:'smooth'});
}
function focus(n){const p=[...document.querySelectorAll('.jark')].find(x=>+x.dataset.n===n);if(!p)return;const b=p.getBBox(),w=Math.max(b.width*2.4,100),h=w*329/602;vb=[b.x+b.width/2-w/2,b.y+b.height/2-h/2,w,h];setVB();}
function pt(e){const r=svg.getBoundingClientRect(),s=Math.min(r.width/vb[2],r.height/vb[3]),ox=(r.width-vb[2]*s)/2,oy=(r.height-vb[3]*s)/2;return [vb[0]+(e.clientX-r.left-ox)/s,vb[1]+(e.clientY-r.top-oy)/s,s];}
function zoom(f,cx,cy){const nw=Math.min(900,Math.max(40,vb[2]*f)),k=nw/vb[2];if(cx==null){cx=vb[0]+vb[2]/2;cy=vb[1]+vb[3]/2}vb=[cx-(cx-vb[0])*k,cy-(cy-vb[1])*k,nw,vb[3]*k];setVB();}
svg.addEventListener('click',e=>{const p=e.target.closest('.jark');if(p&&!moved)show(+p.dataset.n,true)});
svg.addEventListener('mousemove',e=>{const p=e.target.closest('.jark');if(!p){tip.style.display='none';return}const c=data.find(x=>x.n===+p.dataset.n);const r=wrap.getBoundingClientRect();tip.textContent=`${c.n}. ${c.name||c.code}`;tip.style.display='block';tip.style.left=(e.clientX-r.left+10)+'px';tip.style.top=(e.clientY-r.top+10)+'px'});
svg.addEventListener('mouseleave',()=>tip.style.display='none');
wrap.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,v:[...vb]};moved=false});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4){moved=true;const s=pt(e)[2];vb=[drag.v[0]-dx/s,drag.v[1]-dy/s,drag.v[2],drag.v[3]];setVB()}});
window.addEventListener('pointerup',()=>drag=null);
wrap.addEventListener('wheel',e=>{e.preventEvent();const [x,y]=pt(e);zoom(e.deltaY>0?1.25:.8,x,y)},{passive:false});
$('#in').onclick=()=>zoom(.75);$('#out').onclick=()=>zoom(1.25);$('#reset').onclick=()=>{vb=[0,0,602,329];setVB()};
panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)show(+b.dataset.nav,true);if(b.dataset.focus)focus(+b.dataset.focus)});
$('#search').oninput=e=>{const q=e.target.value.trim().toLower();const c=data.find(x=>q&&(String(x.n)==q||JSON.stringify(x).toLower().includes(q)));if(c){show(c.n,false);focus(c.n)}};
fetch('dane.json').then(r=>r.json()).then(d=>{data=d;render();const m=location.hash.match(/^#jark-(\d+)$/);if(m)show(+m[1])}).catch(()=>panel.innerHTML='<h1>Nie udało się wczytać danych</h1><p>Sprawdź, czy dane.json znajduje się obok index.html.</p>');
</script>
</body>
</html>
